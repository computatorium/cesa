name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(python3 tools/release_info.py)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag must match package.json: v%s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: gd, mbstring
          coverage: none
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: docker compose build
      - name: Verify release archive
        run: python3 tools/verify-release.py
      - name: Collect release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/cesa-release"
          cp "dist/cesa-$VERSION.tar.gz" dist/SHA256SUMS docs/verification-results.json "$RUNNER_TEMP/cesa-release/"
      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cesa-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/cesa-release/
          if-no-files-found: error
          compression-level: 0
      - name: Save failed test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Stop fixture
        if: always()
        run: docker compose down

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cesa-${{ needs.build.outputs.version }}
          path: release
      - name: Publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          sha256sum --check SHA256SUMS
          archive="cesa-$VERSION.tar.gz"
          printf 'Extract `%s` into `lib/tpl/`, then select `cesa` in Configuration Manager.\n' "$archive" > notes.md
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$archive" SHA256SUMS verification-results.json --clobber
          else
            gh release create "$TAG" "$archive" SHA256SUMS verification-results.json \
              --verify-tag --title "Cesa $VERSION" --notes-file notes.md "${flags[@]}"
          fi
